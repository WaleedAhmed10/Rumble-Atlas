services:
  - type: web
    name: wwe-royal-rumble-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true   # Render creates a long random secret for you
      - key: CLIENT_ORIGIN
        sync: false           # your website URL, e.g. https://my-app.vercel.app (no trailing slash)
